<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 190" role="img" aria-labelledby="title desc">
<title id="title">Streaming voice agent pipeline</title><desc id="desc">Incoming speech enters VAD, then Whisper transcription, GPT-4 response generation, and spoken reply.</desc>
<rect width="850" height="190" fill="#f7f8fb"/>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#24334a" font-size="17">
<rect x="20" y="48" width="145" height="78" rx="6" fill="#fff" stroke="#aab7ca"/><text x="92" y="92">Incoming speech</text>
<rect x="190" y="48" width="140" height="78" rx="6" fill="#fff" stroke="#aab7ca"/><text x="260" y="82">WebRTC VAD</text><text x="260" y="104" font-size="13">Endpointing</text>
<rect x="355" y="48" width="140" height="78" rx="6" fill="#fff" stroke="#aab7ca"/><text x="425" y="82">Whisper</text><text x="425" y="104" font-size="13">Transcription</text>
<rect x="520" y="48" width="140" height="78" rx="6" fill="#fff" stroke="#aab7ca"/><text x="590" y="82">GPT-4</text><text x="590" y="104" font-size="13">Response</text>
<rect x="685" y="48" width="145" height="78" rx="6" fill="#fff" stroke="#aab7ca"/><text x="758" y="92">Spoken reply</text>
</g>
<g stroke="#527397" stroke-width="2" fill="none"><path d="M165 87h25m140 0h25m140 0h25m140 0h25"/></g>
<g fill="#527397"><path d="m184 82 7 5-7 5m166-10 7 5-7 5m166-10 7 5-7 5m166-10 7 5-7 5"/></g>
<text x="425" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5a6879">Buffering and stage timing tuned for under four seconds per response</text>
</svg>
